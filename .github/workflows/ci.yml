---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (no AWS credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run test suite
        run: >-
          poetry run pytest --cov-report=xml
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: ./junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Runs on every PR, including release-please's release PR, so packaging
  # breakage is caught before a release exists rather than after.
  package:
    name: packaging (build + install + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Build sdist and wheel
        run: poetry build

      - name: Check distribution metadata
        run: pipx run twine check --strict dist/*

      # Asserts the built artifact, not just the declaration that
      # tests/test_packaging.py pins (ADR-0004).
      - name: Assert the wheel claims one top-level name
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          tops = {
              name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()
          }
          tops = {name for name in tops if not name.endswith(".dist-info")}
          assert tops == {"aws_resource_inventory"}, f"unexpected top-level names: {sorted(tops)}"
          print("wheel top-level:", sorted(tops))
          PY

      # twine check only validates metadata — it passed for 0.1.0, whose
      # wheel was missing cli.py entirely, so the installed console script
      # died on ModuleNotFoundError. Installing the wheel into a clean venv
      # and running both entry points is what proves the artifact works.
      - name: Install the wheel and run both entry points
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/aws-inventory --help
          /tmp/smoke/bin/aws-resource-inventory scan --help
