---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (no AWS credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run test suite
        run: >-
          poetry run pytest --cov-report=xml
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Runs on every PR, including release-please's release PR, so packaging
  # breakage is caught before a release exists rather than after. The
  # release workflow repeats these two steps on the released commit.
  package:
    name: packaging (build + metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Build sdist and wheel
        run: poetry build

      - name: Check distribution metadata
        run: pipx run twine check --strict dist/*
