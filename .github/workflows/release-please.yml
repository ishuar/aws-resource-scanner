---
name: Release Please

on:
  push:
    branches: [main]
  # Publish an already-released tag to PyPI. Needed because the PyPI job
  # only runs on the push that creates a release, so a failure anywhere
  # in the pipeline would otherwise leave a released tag unpublishable.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to publish to PyPI (e.g. v0.1.0). Leave empty to only run release-please."
        required: false
        type: string

# Never cancel an in-flight release run; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Output release information
        run: |
          echo "Release Created: ${{ steps.release.outputs.release_created }}"
          echo "Tag Name: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"

  build:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    permissions:
      contents: write # attach assets to, and publish, the draft release
      id-token: write # sign build provenance attestations
      attestations: write
    env:
      # Reaches shell only as an env var, never interpolated into a run
      # script: publish_tag is user input and would otherwise be a
      # shell-injection vector.
      release_tag: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
    steps:
      # The release path builds github.sha — the commit that merged the
      # release PR, and so the commit release-please released. It
      # deliberately does not build the tag: whether a draft release creates
      # its tag up front is undocumented, and this works either way.
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_tag || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Verify tag matches package version
        run: |
          pkg_version="$(poetry version --short)"
          tag_version="${release_tag#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::pyproject.toml version ($pkg_version) does not match release version ($tag_version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: poetry build

      - name: Check distribution metadata
        run: pipx run twine check --strict dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The attested files themselves are what gets published, so the
      # attestation describes the artifacts users actually install.
      - name: Upload distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      # Assets can only be attached while the release is still a draft;
      # publishing seals it (see docs/adr/0002). Both steps are skipped on
      # the publish_tag recovery path, whose release is already published
      # and therefore immutable — attaching there is the 422 that made this
      # workflow fail in the first place.
      - name: Attach distributions to the draft release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$release_tag" dist/* --repo "$GITHUB_REPOSITORY"

      - name: Publish the draft release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$release_tag" --draft=false --repo "$GITHUB_REPOSITORY"

  # Publishes via OIDC trusted publishing (no API tokens).
  # One-time setup required before the first release:
  #   1. Add a "pending trusted publisher" on
  #      https://pypi.org/manage/account/publishing/ with:
  #        project:  aws-resource-inventory
  #        owner:    ishuar
  #        repo:     aws-resource-inventory
  #        workflow: release-please.yml
  #        environment: pypi
  #   2. Create a GitHub environment named "pypi"
  #      (Settings -> Environments), optionally with required reviewers.
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    environment:
      name: pypi
      url: https://pypi.org/p/aws-resource-inventory
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      # Publishes exactly the artifacts the build job attested — never a
      # second, differently-hashed build of the same source. v8 errors on a
      # digest mismatch by default; that default is the point, so it is left
      # alone (never set digest-mismatch to warn).
      - name: Download the built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
