---
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight release run; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Output release information
        run: |
          echo "Release Created: ${{ steps.release.outputs.release_created }}"
          echo "Tag Name: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"

  build:
    name: Build and Attach Python Distributions
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload assets to the GitHub release
      id-token: write # sign build provenance attestations
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Verify tag matches package version
        run: |
          pkg_version="$(poetry version --short)"
          tag_version="${{ needs.release-please.outputs.version }}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::pyproject.toml version ($pkg_version) does not match release version ($tag_version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: poetry build

      - name: Check distribution metadata
        run: pipx run twine check --strict dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ needs.release-please.outputs.tag_name }}' dist/* --repo '${{ github.repository }}'

  # Publishes via OIDC trusted publishing (no API tokens).
  # One-time setup required before the first release:
  #   1. Add a "pending trusted publisher" on
  #      https://pypi.org/manage/account/publishing/ with:
  #        project:  aws-resource-inventory
  #        owner:    ishuar
  #        repo:     aws-resource-inventory
  #        workflow: release-please.yml
  #        environment: pypi
  #   2. Create a GitHub environment named "pypi"
  #      (Settings -> Environments), optionally with required reviewers.
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/aws-resource-inventory
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install poetry
        run: pipx install poetry

      - name: Build sdist and wheel
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
